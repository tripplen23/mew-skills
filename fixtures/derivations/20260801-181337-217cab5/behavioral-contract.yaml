intentional_changes: []
normalization_rules:
  - "JSON key order may differ between frameworks"
  - "timestamp values are generated at insert time and necessarily differ between baseline and candidate runs; compare format (ISO 8601 UTC) and presence, not exact value"
  - "content-type for the DELETE 200 body may be text/html or text/plain; the body TEXT is contractual, the exact media type is not"
  - "RFC 9457 problem+json body: type/title/detail/status fields must match exactly"
  - "Python marshmallow serializes timestamps as ISO UTC with microseconds; Rust chrono must emit the same format (e.g. 2026-08-01T14:59:39.765321)"
