      - "config.py"
      - "server.py"
      - "swagger.yml"
    target_paths:
      - "Cargo.toml"
      - "src/main.rs"
      - "src/models.rs"
      - "src/db.rs"
      - "src/routes.rs"
      - "src/problem.rs"
    depends_on: []
    contract_properties:
      - "P001"
      - "P002"
      - "P003"
      - "P004"
      - "P005"
      - "P006"
      - "P007"
      - "P008"
      - "P009"
      - "P010"
      - "P011"
    risk: medium
    pilot: true
stop_conditions:
  - "rusqlite cannot reproduce the SQLite schema (person_id INTEGER PRIMARY KEY AUTOINCREMENT, lname/fname VARCHAR(100) indexed, timestamp DATETIME)"
  - "Cannot reproduce ISO UTC microsecond timestamp format"
  - "Any contract property fails differential comparison after 3 fix attempts"
performance_gates: []
worker_policy:
  isolation: none
  one_writer_per_unit: true
  editable_paths:
    - "src/"
    - "Cargo.toml"
    - "scripts/"
  protected_paths:
    - ".mew/"
    - "swagger.yml"
